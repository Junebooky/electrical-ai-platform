[project]
name = "eai-api"
version = "0.1.0"
description = "Local FastAPI service for the Electrical AI Platform (MVP 1: DXF Smart Takeoff)"
requires-python = ">=3.12"
dependencies = [
    "eai-cad-engine",
    "fastapi>=0.116,<1",
    "uvicorn[standard]>=0.35",
    "python-multipart>=0.0.20",
    "openpyxl>=3.1.5",
]

[tool.uv.sources]
eai-cad-engine = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/eai_api"]
